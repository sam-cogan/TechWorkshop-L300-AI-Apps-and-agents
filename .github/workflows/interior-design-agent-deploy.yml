name: Deploy Interior Design Agent

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/agents/interiorDesignAgent_initializer.py'
      - 'src/prompts/InteriorDesignAgentPrompt.txt'
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/agents/interiorDesignAgent_initializer.py'
      - 'src/prompts/InteriorDesignAgentPrompt.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-interior-design-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/requirements.txt'

      - name: Install dependencies
        working-directory: ./src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create .env file
        working-directory: ./src
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Set environment variables
        run: |
          echo "${{ secrets.ENV }}" >> $GITHUB_ENV

      - name: Deploy Interior Design Agent
        working-directory: ./src/app/agents
        run: |
          python interiorDesignAgent_initializer.py

      - name: Azure Logout
        if: always()
        run: |
          az logout
