name: Deploy Handoff Agent

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/agents/handoffAgent_initializer.py'
      - 'src/prompts/HandoffAgentPrompt.txt'
      - 'src/services/handoff_service.py'
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/agents/handoffAgent_initializer.py'
      - 'src/prompts/HandoffAgentPrompt.txt'
      - 'src/services/handoff_service.py'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-handoff-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/requirements.txt'

      - name: Install dependencies
        working-directory: ./src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create .env file and deploy agent
        working-directory: ./src
        run: |
          echo "${{ secrets.ENV }}" > .env
          # Export all environment variables from .env file
          set -a
          source .env
          set +a
          # Run the Python script
          cd app/agents
          python handoffAgent_initializer.py

      - name: Azure Logout
        if: always()
        run: |
          az logout
