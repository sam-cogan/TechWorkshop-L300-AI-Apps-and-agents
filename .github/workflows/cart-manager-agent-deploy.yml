name: Deploy Cart Manager Agent

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/agents/cartManagerAgent_initializer.py'
      - 'src/prompts/CartManagerPrompt.txt'
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/agents/cartManagerAgent_initializer.py'
      - 'src/prompts/CartManagerPrompt.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-cart-manager-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/requirements.txt'

      - name: Install dependencies
        working-directory: ./src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create .env file and deploy agent
        working-directory: ./src
        run: |
          echo "${{ secrets.ENV }}" > .env
          # Use Python to load .env and run the script
          python -c "
import os
from dotenv import load_dotenv
load_dotenv()
# Set environment variables for the current process and subprocesses
for key, value in os.environ.items():
    os.environ[key] = value
# Now run the actual script
import sys
sys.path.insert(0, 'app/agents')
os.chdir('app/agents')
exec(open('cartManagerAgent_initializer.py').read())
"

      - name: Azure Logout
        if: always()
        run: |
          az logout
